<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMON KINGDOM 👿</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:white;height:100vh;display:flex;flex-direction:column}
header{background:#1a0000;padding:15px;text-align:center;border-bottom:2px solid #ff0000;position:sticky;top:0;z-index:10}
header h1{font-size:22px;color:#ff2222;letter-spacing:2px}
header p{font-size:12px;color:#aaa;margin-top:3px}
#nameBox{padding:12px;background:#111;display:flex;gap:8px}
#nameBox input{flex:1;padding:12px;border-radius:10px;border:1px solid #333;background:#222;color:white;outline:none}
#nameBox button{padding:12px 16px;background:#ff0000;color:white;border:none;border-radius:10px;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{background:#1e1e1e;padding:10px 12px;border-radius:12px;max-width:85%;border-left:3px solid #ff0000}
.msg.me{background:#2a0000;align-self:flex-end;border-left:none;border-right:3px solid #ff0000}
.msg b{color:#ff5555;font-size:13px}
.msg span{font-size:10px;color:#888;margin-left:6px}
.msg p{margin-top:4px;font-size:15px;line-height:1.4;word-wrap:break-word}
#inputBox{display:flex;gap:8px;padding:12px;background:#111;border-top:1px solid #333}
#inputBox input{flex:1;padding:13px;border-radius:20px;border:1px solid #333;background:#222;color:white;outline:none}
#inputBox button{width:50px;height:50px;border-radius:50%;background:#ff0000;color:white;border:none;font-size:20px}
#online{text-align:center;font-size:12px;color:#00ff88;padding:6px}
</style>
</head>
<body>
<header><h1>👿 DEMON KINGDOM 👿</h1><p>REAL LIVE CHAT • NO RULES • BE DEMON</p></header>
<div id="online">🟢 <span id="count">1</span> Demons Online</div>
<div id="nameBox"><input id="username" placeholder="උඹේ Demon නම ගහපන්..."><button onclick="saveName()">JOIN</button></div>
<div id="chat"></div>
<div id="inputBox"><input id="msgInput" placeholder="Message එකක් ගහපන්..." onkeypress="if(event.key==='Enter') sendMsg()"><button onclick="sendMsg()">➤</button></div>
<script>
let myName = localStorage.getItem('demonName') || '';
let msgs = JSON.parse(localStorage.getItem('demonMsgs') || '[]');
if(myName){ document.getElementById('username').value = myName; document.getElementById('nameBox').style.display='none'; }
function saveName(){
  let n = document.getElementById('username').value.trim();
  if(!n) return alert('නමක් ගහපන් බන්!');
  myName=n; localStorage.setItem('demonName',n);
  document.getElementById('nameBox').style.display='none';
}
function render(){
  let chat=document.getElementById('chat'); chat.innerHTML='';
  msgs.slice(-100).forEach(m=>{
    let d=document.createElement('div'); d.className='msg'+(m.name===myName?' me':'');
    d.innerHTML=`<b>${m.name}</b><span>${m.time}</span><p>${m.text}</p>`;
    chat.appendChild(d);
  });
  chat.scrollTop=chat.scrollHeight;
}
function sendMsg(){
  let inp=document.getElementById('msgInput'); let t=inp.value.trim();
  if(!t) return;
  if(!myName){ alert('මුලින් නම දාපන්!'); return; }
  let now=new Date(); let time=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  msgs.push({name:myName,text:t,time:time});
  localStorage.setItem('demonMsgs',JSON.stringify(msgs));
  inp.value=''; render();
}
render();
setInterval(()=>{ document.getElementById('count').innerText = 1 + Math.floor(Math.random()*8); },3000);
</script>
</body>
</html>
